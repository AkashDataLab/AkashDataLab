<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="60" viewBox="0 0 920 60" role="img"><title>typing light</title><style>@keyframes reveal{0%,8%{width:0}55%,100%{width:920px}}@keyframes blink{50%{opacity:0}}.reveal{animation:reveal 8s steps(55,end) infinite}.cursor{animation:blink 1s steps(1) infinite}@media(prefers-reduced-motion:reduce){.reveal,.cursor{animation:none}}</style><defs><clipPath id="line"><rect class="reveal" x="0" y="0" width="920" height="60"/></clipPath></defs><g clip-path="url(#line)"><text x="460" y="36" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27" fill="#7254bb" text-anchor="middle" font-weight="700">Akash Kumar · Aspiring Data Specialist</text></g></svg>